      - "Task-03：实现插件客户端密钥与短期认证业务行为"
      - "Task-06：实现 n8n 外围回调边界业务行为"
      - "Task-07：实现 Iteration 11 OpenAPI 与前端 API Client 契约"
  - type: integration
    standard: standards/testing/integration.md
    test_file: iteration11_platform_adapter_contract_red_test.go
    resources: []
    covers:
      - "Task-04：实现插件发布任务锁定与回填业务行为"
      - "Task-05：实现平台采集日志与人工确认指标业务行为"
  - type: frontend-ui
    standard: standards/testing/frontend-ui.md
    test_file: iteration11_platform_adapter_contract_red_test.go
    resources: []
    covers:
      - "Task-08：实现管理台平台 Adapter 与插件客户端页面交互"
      - "Task-09：实现管理台采集日志与 n8n 回调页面交互"
  - type: sql-query
    standard: standards/testing/sql-query.md
    test_file: platform_adapter_sql_contract_test.go
    resources:
      - apps/api-server/migrations/00013_create_platform_adapter_extension_tables.sql
    covers:
      - "Task-01：定义平台适配器与插件协作数据库契约"