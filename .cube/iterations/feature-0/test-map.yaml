    test_file: server_test.go
    test_cases: 1
  - task: "Task-02：实现统一 API 响应契约骨架"
    module: http/api
    test_file: response_test.go
    test_cases: 1
  - task: "Task-03：实现系统健康与信息接口骨架"
    module: system
    test_file: health_info_test.go
    test_cases: 1
  - task: "Task-04：实现系统配置检查接口骨架"
    module: system
    test_file: config_check_test.go
    test_cases: 1
  - task: "Task-05：实现数据库与迁移状态检查接口骨架"
    module: system
    test_file: db_migration_test.go
    test_cases: 1
  - task: "Task-06：建立 operation_log 迁移与操作日志接口骨架"
    module: store
    test_file: operation_log_test.go
    test_cases: 1
  - task: "Task-07：建立异步任务队列契约骨架"
    module: worker
    test_file: queue_test.go
    test_cases: 2
  - task: "Task-08：建立 OpenAPI 文档入口骨架"
    module: http
    test_file: router_test.go
    test_cases: 1
  - task: "Task-09：建立 Next.js 管理台壳层骨架"
    module: app
    test_file: web_admin_test.go
    test_cases: 1
  - task: "Task-10：建立 CI 基线"
    module: app
    test_file: ci_test.go
    test_cases: 1

type_tests:
  - type: web-e2e
    standard: standards/testing/web-e2e.md
    test_file: router_test.go
    resources: []
    covers:
      - "Task-03：实现系统健康与信息接口骨架"
      - "Task-04：实现系统配置检查接口骨架"
      - "Task-08：建立 OpenAPI 文档入口骨架"
  - type: integration
    standard: standards/testing/integration.md
    test_file: db_migration_test.go
    resources: []
    covers:
      - "Task-05：实现数据库与迁移状态检查接口骨架"
  - type: library
    standard: standards/testing/library.md
    test_file: response_test.go
    resources: []
    covers:
      - "Task-02：实现统一 API 响应契约骨架"
  - type: sql-query
    standard: standards/testing/sql-query.md
    test_file: operation_log_test.go
    resources:
      - apps/api-server/migrations/00001_create_operation_log.sql
    covers:
      - "Task-06：建立 operation_log 迁移与操作日志接口骨架"
  - type: batch-job
    standard: standards/testing/batch-job.md
    test_file: queue_test.go
    resources: []
    covers:
      - "Task-07：建立异步任务队列契约骨架"
  - type: cli
    standard: standards/testing/cli.md
    test_file: ci_test.go
    resources:
      - .github/workflows/ci.yml
    covers:
      - "Task-10：建立 CI 基线"
