tasks:
  - task: "Task-01：定义平台适配器与插件协作数据库契约"
    module: api-server/store
    test_file: platform_adapter_sql_contract_test.go
    test_cases: 2
    task_type: migration
    data_operations: 写 platform_adapter_config、platform_adapter_revision、plugin_client、plugin_access_token、platform_collect_log、external_callback_log 表结构；修改 publish_target；修改 publish_job；修改 publish_log 事件约束；修改 external_workflow_binding callback auth 字段
    boundary: "只新增 00013 migration 和 SQL 契约测试；只通过 ALTER TABLE 扩展既有 publish 表；只安全调整 publish_log event_type CHECK"
    forbidden: "不得删除既有表；不得保存 api_key、password、secret 明文字段；不得重写旧迁移；不得使用未白名单动态 ORDER BY"
  - task: "Task-02：实现平台 Adapter 配置管理业务行为"
    module: api-server/publish
    test_file: iteration11_task02_adapter_contract_red_test.go
    test_cases: 1
    task_type: business-implementation
    data_operations: 读写 platform_adapter_config；写 platform_adapter_revision；读外部 credential/provider/binding 引用；停用前按 publish_job.adapter_config_id 与 publish_target 平台/目标类型回退匹配读取 publish_job；写 operation_log
    boundary: "只新增 publish DTO/Service/Handler 中 Adapter 相关类型和方法；只在 router.go 注册 Adapter routes；只以向后兼容方式为 publish target/job 增加 Adapter 映射字段"
    forbidden: "不得保存平台凭证明文；不得新增独立 platform 模块；不得破坏既有 publish target API 语义；不得在仍有 queued/copied/locked 任务时停用 Adapter"
  - task: "Task-03：实现插件客户端密钥与短期认证业务行为"
    module: api-server/publish
    test_file: iteration11_task03_plugin_client_contract_red_test.go
    test_cases: 1
    task_type: business-implementation
    data_operations: 读写 plugin_client；写 plugin_access_token；写 operation_log；更新 last_active_at；写认证失败审计
    boundary: "只新增 publish DTO/Service/Handler 中插件客户端和认证相关类型和方法；只在 router.go 注册插件客户端和认证 routes"
    forbidden: "不得保存 api_key 明文；不得泄露密钥校验细节；不得让禁用客户端认证成功；plugin-auth 不得强制 admin bearer"
  - task: "Task-04：实现插件发布任务锁定与回填业务行为"
    module: api-server/publish
    test_file: iteration11_task04_plugin_publish_job_contract_red_test.go
    test_cases: 1
    task_type: business-implementation
    data_operations: 读 plugin_access_token 和 plugin_client；读 platform_adapter_config；以原子条件更新 publish_job 锁字段；读写 publish_job 状态；写 publish_log；写 operation_log；读写幂等记录
    boundary: "只扩展 publish Service、Handler、DTO 和 router 中插件任务相关方法；只追加 publish_job 状态辅助逻辑"
    forbidden: "不得新增第二套发布主状态机；不得绕过 publish_job；不得使用事务外 read-then-write 领取锁；不得在 lock/client/payload 无效时推进状态；不得重复处理相同幂等键"
  - task: "Task-05：实现平台采集日志与人工确认指标业务行为"
    module: api-server/metrics
    test_file: iteration11_task05_collect_log_contract_red_test.go
    test_cases: 1
    task_type: business-implementation
    data_operations: 插入/列表/读取/更新 platform_collect_log；读 metric_template；写 metric_record；写 operation_log；读写幂等记录；确认时更新 collect_log 状态
    boundary: "只扩展 metrics DTO/Service/Handler/router；只修改 store.go、memory_store.go、postgres_store.go 中 collect log 所需接口与实现；只复用既有 MetricRecord 写入语义"
    forbidden: "不得默认自动写入 metric_record；不得丢弃失败采集摘要；不得重复确认污染指标；不得绕过 MetricRecord uniqueness/source 规则；不得整文件重写 store 文件"
  - task: "Task-06：实现 n8n 外围回调边界业务行为"
    module: api-server/external
    test_file: iteration11_task06_callback_contract_red_test.go
    test_cases: 1
    task_type: business-implementation
    data_operations: 读写 external binding callback auth 字段；读 external provider；读写 external_callback_log；读写幂等记录
    boundary: "只扩展 external DTO/Service/Handler 和 router 中回调相关方法；只记录外围事件"
    forbidden: "不得创建 WorkflowRun；不得推进 Agent 编排；不得修改内容正文；不得直接改 publish_job 主状态；不得把 stable_event_id 当认证"
  - task: "Task-07：实现 Iteration 11 OpenAPI 与前端 API Client 契约"
    module: openapi/web-admin
    test_file: iteration11_task07_openapi_contract_red_test.go
    test_cases: 1
    task_type: contract
    data_operations: 无
    boundary: "只修改 openapi/openapi.yaml 和 apps/web-admin/lib/api.ts 中 Iteration 11 相关定义"
    forbidden: "不得改变既有 API client 函数签名；不得删除旧 OpenAPI paths；不得使用 any 表示新增公共响应；不得遗漏 callback-log 和 test callback API"
  - task: "Task-08：实现管理台平台 Adapter 与插件客户端页面交互"
    module: web-admin
    test_file: iteration11_task08_pages_contract_red_test.go
    test_cases: 1
    task_type: ui
    data_operations: 调用 Adapter 和 plugin client HTTP API
    boundary: "只新增两个页面；只为 `/platform-adapters`、`/plugin-clients` 追加 global-nav 项；只使用现有 CSS class 和 API client"
    forbidden: "不得裸 HTML 无样式；不得刷新 404；不得在页面状态中持久化 api_key_once 超出弹窗生命周期；不得偏离 prototype 管理台视觉"
  - task: "Task-09：实现管理台采集日志与 n8n 回调页面交互"
    module: web-admin
    test_file: iteration11_task09_pages_contract_red_test.go
    test_cases: 1
    task_type: ui
    data_operations: 调用 platform_collect_log 和 external callback/callback-log HTTP API
    boundary: "只新增采集日志页面；只修改 n8n 页面 Iteration 11 区域；只为 `/platform-collect-logs` 追加 global-nav 项并保留既有 n8n 入口"
    forbidden: "不得默认自动确认指标；不得隐藏失败采集记录；不得让按钮点击无反馈；不得偏离 prototype 管理台视觉"

