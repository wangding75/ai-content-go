project:
  name: ai-content-go
  language: golang
  structure: multi-module
  features: []

stages:
  - id: 01-prd
    name: PRD
  - id: 02-design
    name: Design
  - id: 03-test-cases
    name: Test Cases
  - id: 04-development
    name: Development
    on_enter:
      - create_status_yaml
      - lock_tests
  - id: 05-testing
    name: Testing

modules:
  - name: api-server
    source_dir: apps/api-server
    test_dir: apps/api-server
    test_resource_dir: apps/api-server/testdata
  - name: web-admin
    source_dir: apps/web-admin
    test_dir: apps/web-admin/e2e
  - name: openapi
    source_dir: openapi

paths:
  test_resource_dir: testdata

language_config:
  build_tool: go
  compile_command: go build ./...
  test_command: go test -race ./...
  red_test_command: go test -race ./...
  green_test_command: go test -race ./...
  test_command_single: go test -race -run {{class}} ./...
  test_file_pattern: '*_test.go'
