openapi: 3.0.3
info:
  title: AI Content Factory API
  version: 0.1.0
paths:
  /api/v1/metric-templates:
    post:
      summary: Create metric template
      description: Creates a metric template with reusable content type, platform, value, aggregation, and period semantics.
      tags: [metrics]
      operationId: createMetricTemplate
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMetricTemplateRequest' }
      responses:
        '201': { description: Metric template created, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMetricTemplateEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
    get:
      summary: List metric templates
      description: Lists metric templates by content type, platform, enabled flag, and pagination.
      tags: [metrics]
      operationId: listMetricTemplates
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: content_type
          in: query
          schema: { type: string }
        - name: platform
          in: query
          schema: { type: string }
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        '200': { description: Metric template list, content: { application/json: { schema: { $ref: '#/components/schemas/MetricTemplatesEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
  /api/v1/metric-records:
    post:
      summary: Create metric record
      description: Creates one metric record with idempotency and stable publish attribution.
      tags: [metrics]
      operationId: createMetricRecord
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMetricRecordRequest' }
      responses:
        '201': { description: Metric record created, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMetricRecordEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
    get:
      summary: List metric records
      description: Lists project metric records. project_id is required.
      tags: [metrics]
      operationId: listMetricRecords
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: platform
          in: query
          required: false
          schema: { type: string }
        - name: target_id
          in: query
          required: false
          schema: { type: string }
        - name: content_item_id
          in: query
          required: false
          schema: { type: string }
        - name: metric_code
          in: query
          required: false
          schema: { type: string }
        - name: date_from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: false
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200': { description: Metric record list, content: { application/json: { schema: { $ref: '#/components/schemas/MetricRecordsEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
  /api/v1/metric-records/batch:
    post:
      summary: Batch create metric records
      description: Imports metric records with per-row failure details and all-failed error semantics.
      tags: [metrics]
      operationId: batchCreateMetricRecords
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchCreateMetricRecordsRequest' }
      responses:
        '200': { description: Metric records imported with possible row errors, content: { application/json: { schema: { $ref: '#/components/schemas/BatchCreateMetricRecordsEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
  /api/v1/projects/{projectId}/metrics/summary:
    get:
      summary: Get metric summary
      description: Returns reproducible metric summary with a stable summary snapshot id.
      tags: [metrics]
      operationId: getMetricSummary
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - name: date_from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: metric_codes
          in: query
          required: true
          schema: { type: string }
        - name: platform
          in: query
          required: false
          schema: { type: string }
        - name: target_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Metric summary, content: { application/json: { schema: { $ref: '#/components/schemas/MetricSummaryEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
  /api/v1/projects/{projectId}/metrics/trends:
    get:
      summary: Get metric trends
      description: Returns bucketed metric trend series, missing points, and query signature.
      tags: [metrics]
      operationId: getMetricTrends
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - name: metric_code
          in: query
          required: true
          schema: { type: string }
        - name: bucket
          in: query
          required: true
          schema: { type: string, enum: [day, week, month] }
        - name: date_from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: platform
          in: query
          required: false
          schema: { type: string }
        - name: target_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Metric trends, content: { application/json: { schema: { $ref: '#/components/schemas/MetricTrendEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
  /api/v1/projects/{projectId}/metrics/missing-dates:
    get:
      summary: Get missing metric dates
      description: Returns required metric dates missing after published jobs.
      tags: [metrics]
      operationId: getMissingMetricDates
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - name: date_from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: metric_code
          in: query
          required: false
          schema: { type: string }
        - name: platform
          in: query
          required: false
          schema: { type: string }
        - name: target_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Missing metric dates, content: { application/json: { schema: { $ref: '#/components/schemas/MissingMetricDatesEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
  /api/v1/projects/{projectId}/publish-targets:
    get:
      summary: List publish targets
      description: Lists project publish targets for creating publish jobs.
      tags: [publish]
      operationId: listPublishTargets
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: enabled
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200': { description: Publish target list, content: { application/json: { schema: { $ref: '#/components/schemas/PublishTargetsEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
    post:
      summary: Create publish target
      description: Creates a non-sensitive project publish target.
      tags: [publish]
      operationId: createPublishTarget
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublishTargetRequest'
            examples:
              default:
                value:
                  platform: wechat
                  account_name: official
                  display_name: 微信公众号
                  config: { section: news }
                  enabled: true
      responses:
        '201': { description: Publish target created, content: { application/json: { schema: { $ref: '#/components/schemas/PublishTargetMutationEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: CONFLICT or IDEMPOTENCY_CONFLICT when state or Idempotency-Key reuse is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                idempotencyConflict:
                  value:
                    success: false
                    data: null
                    error: { code: IDEMPOTENCY_CONFLICT, message: idempotency key payload differs, details: [] }
                    request_id: req-example
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
  /api/v1/projects/{projectId}/publish-targets/{id}:
    patch:
      summary: Update publish target
      description: Updates display-only publish target configuration scoped to the project.
      tags: [publish]
      operationId: updatePublishTarget
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublishTargetRequest'
            examples:
              default:
                value:
                  platform: wechat
                  account_name: official
                  display_name: 微信公众号
                  config: { section: news }
                  enabled: true
                  note: update display config
      responses:
        '200': { description: Publish target updated, content: { application/json: { schema: { $ref: '#/components/schemas/PublishTargetMutationEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT or IDEMPOTENCY_CONFLICT when state or Idempotency-Key reuse is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                idempotencyConflict:
                  value:
                    success: false
                    data: null
                    error: { code: IDEMPOTENCY_CONFLICT, message: idempotency key payload differs, details: [] }
                    request_id: req-example
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
  /api/v1/projects/{projectId}/publish-jobs:
    get:
      summary: List publish jobs
      description: Lists publish queue jobs with filters and pagination.
      tags: [publish]
      operationId: listPublishJobs
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: target_id
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [queued, copied, published, failed, canceled] }
        - name: scheduled_from
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200': { description: Publish job list, content: { application/json: { schema: { $ref: '#/components/schemas/PublishJobsEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
    post:
      summary: Create publish job
      description: Enqueues an approved content version for manual publishing.
      tags: [publish]
      operationId: createPublishJob
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublishJobRequest'
            examples:
              default:
                value:
                  content_item_id: content-item-1
                  content_version_id: content-version-approved-1
                  target_id: publish-target-1
      responses:
        '201': { description: Publish job created, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePublishJobEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT or IDEMPOTENCY_CONFLICT when state or Idempotency-Key reuse is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                idempotencyConflict:
                  value:
                    success: false
                    data: null
                    error: { code: IDEMPOTENCY_CONFLICT, message: idempotency key payload differs, details: [] }
                    request_id: req-example
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
  /api/v1/projects/{projectId}/publish-jobs/{id}:
    get:
      summary: Get publish job
      description: Returns current publish job detail and logs scoped to the project.
      tags: [publish]
      operationId: getPublishJob
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Publish job detail, content: { application/json: { schema: { $ref: '#/components/schemas/PublishJobDetailEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
  /api/v1/projects/{projectId}/publish-jobs/{id}/copy-payload:
    get:
      summary: Get publish copy payload
      description: Previews copy payload without changing publish job state.
      tags: [publish]
      operationId: getPublishCopyPayload
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Publish copy payload, content: { application/json: { schema: { $ref: '#/components/schemas/PublishCopyPayloadEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
  /api/v1/projects/{projectId}/publish-jobs/{id}/copy:
    post:
      summary: Copy publish payload
      description: Records a user copy action and moves queued jobs to copied.
      tags: [publish]
      operationId: copyPublishPayload
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyPublishPayloadRequest'
            examples:
              default:
                value:
                  copy_scope: full
                  note: manual copy
      responses:
        '200': { description: Publish payload copied, content: { application/json: { schema: { $ref: '#/components/schemas/CopyPublishPayloadEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT or IDEMPOTENCY_CONFLICT when state or Idempotency-Key reuse is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                idempotencyConflict:
                  value:
                    success: false
                    data: null
                    error: { code: IDEMPOTENCY_CONFLICT, message: idempotency key payload differs, details: [] }
                    request_id: req-example
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
  /api/v1/projects/{projectId}/publish-jobs/{id}/mark-published:
    post:
      summary: Mark publish job as published
      description: Backfills manual publication result for a copied job.
      tags: [publish]
      operationId: markPublishJobPublished
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkPublishedRequest'
            examples:
              default:
                value:
                  external_url: https://example.com/post/1
                  published_at: '2026-05-21T09:00:00Z'
                  reason: ''
                  note: manually published
      responses:
        '200': { description: Publish job marked published, content: { application/json: { schema: { $ref: '#/components/schemas/MarkPublishedEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT or IDEMPOTENCY_CONFLICT when state or Idempotency-Key reuse is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                idempotencyConflict:
                  value:
                    success: false
                    data: null
                    error: { code: IDEMPOTENCY_CONFLICT, message: idempotency key payload differs, details: [] }
                    request_id: req-example
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
  /api/v1/projects/{projectId}/publish-jobs/{id}/mark-failed:
    post:
      summary: Mark publish job as failed
      description: Records manual publication failure reason.
      tags: [publish]
      operationId: markPublishJobFailed
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkFailedRequest'
            examples:
              default:
                value:
                  reason: platform rejected
                  retryable: true
                  note: retry later
      responses:
        '200': { description: Publish job marked failed, content: { application/json: { schema: { $ref: '#/components/schemas/MarkFailedEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT or IDEMPOTENCY_CONFLICT when state or Idempotency-Key reuse is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                idempotencyConflict:
                  value:
                    success: false
                    data: null
                    error: { code: IDEMPOTENCY_CONFLICT, message: idempotency key payload differs, details: [] }
                    request_id: req-example
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
  /api/v1/projects/{projectId}/publish-jobs/{id}/requeue:
    post:
      summary: Requeue publish job
      description: Requeues a failed or retry-allowed publish job.
      tags: [publish]
      operationId: requeuePublishJob
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequeuePublishJobRequest'
            examples:
              default:
                value:
                  reason: retry after manual fix
                  scheduled_at: '2026-05-21T10:00:00Z'
                  note: corrected payload
      responses:
        '200': { description: Publish job requeued, content: { application/json: { schema: { $ref: '#/components/schemas/RequeuePublishJobEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT or IDEMPOTENCY_CONFLICT when state or Idempotency-Key reuse is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
