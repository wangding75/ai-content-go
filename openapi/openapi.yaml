components:
  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    RunIdPath:
      name: runId
      in: path
      required: true
      schema:
        type: string
    TopicIdPath:
      name: topicId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated caller is not allowed to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Unique constraint, idempotency, or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CreateGenerationRunRequest:
      type: object
      properties:
        confirmed_topic_id: { type: string }
        worldview_version_id: { type: string }
        arc_id: { type: string }
        target_count: { type: integer, minimum: 1 }
        start_sequence_no: { type: integer, minimum: 1 }
        template_version_id: { type: string }
        generation_config: { type: object }
      required: [confirmed_topic_id, worldview_version_id, arc_id, target_count, start_sequence_no, template_version_id]
    CreateReviewRequest:
      type: object
      properties:
        review_type: { type: string, enum: [manual, ai, combined] }
      required: [review_type]
    CreateReviewResponse:
      type: object
      properties:
        review_id: { type: string }
        status: { type: string }
      required: [review_id, status]
    ContentReviewResponse:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        content_item_id: { type: string }
        review_type: { type: string }
        status: { type: string }
        title: { type: string }
        updated_at: { type: string, format: date-time }
      required: [id, project_id, content_item_id, review_type, status, title, updated_at]
    ContentReviewsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentReviewResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [items, pagination]
    ReviewReportSummaryResponse:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        quality_score: { type: integer }
        risk_level: { type: string }
      required: [id, status, quality_score, risk_level]
    ContentVersionResponse:
      type: object
      properties:
        id: { type: string }
        content_item_id: { type: string }
        version_no: { type: integer }
        source: { type: string }
        title: { type: string }
        body: { type: string }
        editable_fields: { type: object }
        summary: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, content_item_id, version_no, source, title, body, editable_fields, summary, created_at]
    ContentVersionsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentVersionResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [items, pagination]
    ContentReviewDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ContentReviewResponse'
        - type: object
          properties:
            body: { type: string }
            metadata: { type: object }
