openapi: 3.0.3
info:
  title: AI Content Factory API
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      summary: Health check
      description: Returns API server health status.
      tags: [system]
      operationId: getHealth
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Health response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/system/info:
    get:
      summary: System info
      description: Returns application name, environment, and build commit.
      tags: [system]
      operationId: getSystemInfo
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: System info response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/system/config-check:
    get:
      summary: Config check
      description: Returns required configuration presence checks.
      tags: [system]
      operationId: getSystemConfigCheck
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Config check response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigCheckEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/system/db-check:
    get:
      summary: Database check
      description: Returns PostgreSQL connectivity status and latency.
      tags: [system]
      operationId: getSystemDBCheck
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Database check response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DBCheckEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - bearerAuth: []
  /api/v1/system/migration-status:
    get:
      summary: Migration status
      description: Returns applied and pending database migrations.
      tags: [system]
      operationId: getSystemMigrationStatus
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Migration status response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationStatusEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Migration status read failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - bearerAuth: []
  /api/v1/dashboard/summary:
    get:
      summary: Dashboard summary
      description: Returns project count, pending review count, pending publish count, failed task count, and today cost.
      tags: [dashboard]
      operationId: getDashboardSummary
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Dashboard summary response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/content-types:
    get:
      summary: List content types
      description: Lists content types with pagination, sorting, and enabled filtering.
      tags: [content]
      operationId: listContentTypes
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Content type list response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentTypesEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
    post:
      summary: Create content type
      description: Creates a content type and returns its ID.
      tags: [content]
      operationId: createContentType
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContentTypeRequest'
            examples:
              default:
                value:
                  code: article
                  name: Article
                  project_schema: {}
      responses:
        '201':
          description: Content type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateContentTypeEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/content-types/{id}/project-schema:
    get:
      summary: Get project schema
      description: Returns the project schema for a content type.
      tags: [content]
      operationId: getProjectSchema
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Project schema response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSchemaEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/projects:
    get:
      summary: List projects
      description: Lists content projects with pagination, sorting, status filtering, and content type filtering.
      tags: [projects]
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: content_type
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Project list response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
    post:
      summary: Create project
      description: Creates a content project for a content type.
      tags: [projects]
      operationId: createProject
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
            examples:
              default:
                value:
                  name: Daily Articles
                  content_type_id: '1'
                  project_config: {}
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/projects/{id}/overview:
    get:
      summary: Get project overview
      description: Returns project progress, pending actions, and cost overview.
      tags: [projects]
      operationId: getProjectOverview
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Project overview response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOverviewEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/projects/{id}/pause:
    post:
      summary: Pause project
      description: Pauses a project and returns the operation log ID.
      tags: [projects]
      operationId: pauseProject
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseProjectRequest'
            examples:
              default:
                value:
                  reason: manual pause
                  note: waiting for review
      responses:
        '200':
          description: Project paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseProjectEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/prompt-templates:
    get:
      summary: List prompt templates
      description: Lists prompt templates with pagination, sorting, and agent filtering.
      tags: [prompt]
      operationId: listPromptTemplates
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: agent_code
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Prompt template list response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplatesEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
    post:
      summary: Create prompt template
      description: Creates a prompt template and returns its ID.
      tags: [prompt]
      operationId: createPromptTemplate
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromptTemplateRequest'
            examples:
              default:
                value:
                  code: outline_writer
                  template: Write an outline for {{topic}}
                  variables: [topic]
      responses:
        '201':
          description: Prompt template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePromptTemplateEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/llm-providers:
    get:
      summary: List LLM providers
      description: Lists LLM providers and only returns masked API keys.
      tags: [llm]
      operationId: listLLMProviders
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Provider list response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMProvidersEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
    post:
      summary: Create LLM provider
      description: Creates an LLM provider and returns only the masked API key.
      tags: [llm]
      operationId: createLLMProvider
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLLMProviderRequest'
            examples:
              default:
                value:
                  provider_type: openai-compatible
                  base_url: https://api.example.invalid/v1
                  api_key: sk-placeholder
      responses:
        '201':
          description: Provider created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLLMProviderEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/workflow-schedules:
    get:
      summary: List workflow schedules
      tags: [workflow-schedules]
      responses:
        '200': { description: Workflow schedule list }
      security:
        - bearerAuth: []
    post:
      summary: Create workflow schedule
      tags: [workflow-schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '201': { description: Workflow schedule created }
      security:
        - bearerAuth: []
  /api/v1/workflow-schedules/{id}/enable:
    post:
      summary: Enable workflow schedule
      tags: [workflow-schedules]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Schedule enabled }
      security:
        - bearerAuth: []
  /api/v1/workflow-schedules/{id}/disable:
    post:
      summary: Disable workflow schedule
      tags: [workflow-schedules]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Schedule disabled }
      security:
        - bearerAuth: []
  /api/v1/workflow-schedules/{id}/test-run:
    post:
      summary: Test run workflow schedule
      tags: [workflow-schedules]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '202': { description: Schedule test run accepted }
      security:
        - bearerAuth: []
  /api/v1/workflow-schedules/{id}/triggers:
    get:
      summary: List workflow schedule triggers
      tags: [workflow-schedules]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Schedule trigger list }
      security:
        - bearerAuth: []
  /api/v1/llm-call-logs/summary:
    get:
      summary: LLM cost summary
      tags: [llm]
      responses:
        '200':
          description: LLM cost summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMCostSummaryResponse'
      security:
        - bearerAuth: []
  /api/v1/external-automation/providers:
    get:
      summary: List external automation providers
      tags: [external-automation]
      responses:
        '200': { description: External provider list }
      security:
        - bearerAuth: []
    post:
      summary: Create external automation provider
      tags: [external-automation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExternalProviderRequest'
      responses:
        '201': { description: External provider created }
      security:
        - bearerAuth: []
  /api/v1/external-automation/bindings:
    get:
      summary: List external automation bindings
      tags: [external-automation]
      responses:
        '200': { description: External binding list }
      security:
        - bearerAuth: []
    post:
      summary: Create external automation binding
      tags: [external-automation]
      responses:
        '201': { description: External binding created }
      security:
        - bearerAuth: []
  /api/v1/projects/{projectId}/novel/planning-runs:
    get:
      summary: List Novel planning runs
      tags: [novel]
      operationId: listNovelPlanningRuns
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Novel planning run list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningRunsEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
    post:
      summary: Create Novel planning run
      tags: [novel]
      operationId: createNovelPlanningRun
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanningRunRequest'
            examples:
              default:
                value:
                  genre: fantasy
                  audience: young-adult
                  count: 3
                  template_version_id: wftv-novel-planning
                  input_override:
                    content_pack: novel
      responses:
        '202':
          description: Novel planning run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePlanningRunEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Workflow run failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/projects/{projectId}/novel/planning-runs/{runId}:
    get:
      summary: Get Novel planning run detail
      tags: [novel]
      operationId: getNovelPlanningRun
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/RunIdPath'
      responses:
        '200':
          description: Novel planning run detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningRunDetailEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/projects/{projectId}/novel/topics/{topicId}/confirm:
    post:
      summary: Confirm Novel topic candidate
      tags: [novel]
      operationId: confirmNovelTopic
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/TopicIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmTopicRequest'
      responses:
        '200':
          description: Topic confirmation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmTopicEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/projects/{projectId}/novel/worldview:
    get:
      summary: Get Novel worldview
      tags: [novel]
      operationId: getNovelWorldview
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Novel worldview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldviewEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
    patch:
      summary: Update Novel worldview
      tags: [novel]
      operationId: updateNovelWorldview
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorldviewRequest'
      responses:
        '200':
          description: Worldview update response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWorldviewEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/projects/{projectId}/novel/characters:
    get:
      summary: List Novel characters
      tags: [novel]
      operationId: listNovelCharacters
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: role
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Novel character list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharactersEnvelope'
        '400':
