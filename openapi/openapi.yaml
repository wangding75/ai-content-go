openapi: 3.0.3
info:
  title: AI Content Factory API
  version: 0.0.0
paths:
  /api/v1/health:
    get:
      summary: Health check
      description: Returns API server health status.
      tags: [system]
      operationId: getHealth
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Health response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/system/info:
    get:
      summary: System info
      description: Returns application name, environment, and build commit.
      tags: [system]
      operationId: getSystemInfo
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: System info response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/system/config-check:
    get:
      summary: Config check
      description: Returns required configuration presence checks.
      tags: [system]
      operationId: getSystemConfigCheck
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Config check response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigCheckEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /api/v1/system/db-check:
    get:
      summary: Database check
      description: Returns PostgreSQL connectivity status and latency.
      tags: [system]
      operationId: getSystemDBCheck
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Database check response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DBCheckEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - bearerAuth: []
  /api/v1/system/migration-status:
    get:
      summary: Migration status
      description: Returns applied and pending database migrations.
      tags: [system]
      operationId: getSystemMigrationStatus
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Migration status response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationStatusEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Migration status read failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - bearerAuth: []
components:
  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        reason:
          type: string
      required: [reason]
    APIError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      required: [code, message, details]
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        data:
          nullable: true
        error:
          $ref: '#/components/schemas/APIError'
        request_id:
          type: string
      required: [success, data, error, request_id]
    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/HealthResponse'
    InfoEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/InfoResponse'
    ConfigCheckEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ConfigCheckResponse'
    DBCheckEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DBCheckResponse'
    MigrationStatusEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MigrationStatusResponse'
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data: {}
        error:
          nullable: true
        request_id:
          type: string
      required: [success, data, error, request_id]
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [status, service, version, timestamp]
    InfoResponse:
      type: object
      properties:
        app_name:
          type: string
        environment:
          type: string
        build_commit:
          type: string
      required: [app_name, environment, build_commit]
    ConfigCheckResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConfigCheckItem'
        summary:
          $ref: '#/components/schemas/ConfigCheckSummary'
      required: [items, summary]
    ConfigCheckItem:
      type: object
      properties:
        key:
          type: string
        required:
          type: boolean
        configured:
          type: boolean
        status:
          type: string
      required: [key, required, configured, status]
    ConfigCheckSummary:
      type: object
      properties:
        total:
          type: integer
        configured:
          type: integer
        missing:
          type: integer
      required: [total, configured, missing]
    DBCheckResponse:
      type: object
      properties:
        database:
          type: string
        status:
          type: string
        latency_ms:
          type: integer
      required: [database, status, latency_ms]
    MigrationStatusResponse:
      type: object
      properties:
        applied_migrations:
          type: array
          items:
            $ref: '#/components/schemas/MigrationInfo'
        pending_migrations:
          type: array
          items:
            $ref: '#/components/schemas/MigrationInfo'
      required: [applied_migrations, pending_migrations]
    MigrationInfo:
      type: object
      properties:
        version:
          type: string
        name:
          type: string
        applied_at:
          type: string
          format: date-time
          nullable: true
      required: [version, name, applied_at]
