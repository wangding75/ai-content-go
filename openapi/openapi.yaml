components:
  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    RunIdPath:
      name: runId
      in: path
      required: true
      schema:
        type: string
    TopicIdPath:
      name: topicId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated caller is not allowed to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Unique constraint, idempotency, or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CreateGenerationRunRequest:
      type: object
      properties:
        confirmed_topic_id: { type: string }
        worldview_version_id: { type: string }
        arc_id: { type: string }
        target_count: { type: integer, minimum: 1 }
        start_sequence_no: { type: integer, minimum: 1 }
        template_version_id: { type: string }
        generation_config: { type: object }
      required: [confirmed_topic_id, worldview_version_id, arc_id, target_count, start_sequence_no, template_version_id]
    CreateReviewRequest:
      type: object
      properties:
        review_type: { type: string, enum: [manual, ai, combined] }
      required: [review_type]
    CreateReviewResponse:
      type: object
      properties:
        review_id: { type: string }
        status: { type: string }
      required: [review_id, status]
    ContentReviewResponse:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        content_item_id: { type: string }
        review_type: { type: string }
        status: { type: string }
        title: { type: string }
        updated_at: { type: string, format: date-time }
      required: [id, project_id, content_item_id, review_type, status, title, updated_at]
    ContentReviewsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentReviewResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [items, pagination]
    ReviewReportSummaryResponse:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        quality_score: { type: integer }
        risk_level: { type: string }
      required: [id, status, quality_score, risk_level]
    ContentVersionResponse:
      type: object
      properties:
        id: { type: string }
        content_item_id: { type: string }
        version_no: { type: integer }
        source: { type: string }
        title: { type: string }
        body: { type: string }
        editable_fields: { type: object }
        summary: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, content_item_id, version_no, source, title, body, editable_fields, summary, created_at]
    ContentVersionsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentVersionResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [items, pagination]
    ContentReviewDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ContentReviewResponse'
        - type: object
          properties:
            body: { type: string }
            metadata: { type: object }
            extension: { type: object }
            report_summary:
              $ref: '#/components/schemas/ReviewReportSummaryResponse'
            versions:
              type: array
              items:
                $ref: '#/components/schemas/ContentVersionResponse'
          required: [body, metadata, extension, report_summary, versions]
    TriggerAIReportRequest:
      type: object
      properties:
        report_type: { type: string }
        config: { type: object }
      required: [report_type, config]
    TriggerAIReportResponse:
      type: object
      properties:
        report_id: { type: string }
        job_id: { type: string }
        workflow_run_id: { type: string }
        status: { type: string }
      required: [report_id, job_id, workflow_run_id, status]
    ReviewIssue:
      type: object
      properties:
        code: { type: string }
        severity: { type: string }
        message: { type: string }
      required: [code, severity, message]
    ReviewSuggestion:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
      required: [code, message]
    ReviewReportResponse:
      type: object
      properties:
        id: { type: string }
        review_id: { type: string }
        content_item_id: { type: string }
        status: { type: string }
        quality_score: { type: integer }
        risk_level: { type: string }
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ReviewIssue'
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/ReviewSuggestion'
        job_id: { type: string }
        workflow_run_id: { type: string }
        error_code: { type: string }
        error_message: { type: string }
      required: [id, review_id, content_item_id, status, quality_score, risk_level, issues, suggestions]
    ApproveReviewRequest:
      type: object
      properties:
        note: { type: string }
    ApproveReviewResponse:
      type: object
      properties:
        review_id: { type: string }
        status: { type: string }
        operation_log_id: { type: string }
      required: [review_id, status, operation_log_id]
    RejectReviewRequest:
      type: object
      properties:
        reason: { type: string }
        regenerate_instruction: { type: string }
        trigger_regeneration: { type: boolean }
      required: [reason, regenerate_instruction, trigger_regeneration]
    RejectReviewResponse:
      type: object
      properties:
        review_id: { type: string }
        status: { type: string }
        operation_log_id: { type: string }
        regeneration_run_id: { type: string }
        job_id: { type: string }
      required: [review_id, status, operation_log_id]
    ApproveWithEditRequest:
      type: object
      properties:
        editable_fields: { type: object }
        note: { type: string }
      required: [editable_fields, note]
    ApproveWithEditResponse:
      type: object
      properties:
        review_id: { type: string }
        status: { type: string }
        content_version_id: { type: string }
        operation_log_id: { type: string }
      required: [review_id, status, content_version_id, operation_log_id]
    CreateGenerationRunResponse:
      type: object
      properties:
        generation_run_id: { type: string }
        workflow_run_id: { type: string }
        status: { type: string }
      required: [generation_run_id, workflow_run_id, status]
    GenerationRunResponse:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        workflow_run_id: { type: string }
        template_version_id: { type: string }
        status: { type: string }
        trigger_type: { type: string }
        retry_of_generation_run_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, project_id, workflow_run_id, template_version_id, status, trigger_type, created_at, updated_at]
    ContentItemResponse:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        generation_run_id: { type: string }
        content_type_code: { type: string }
        status: { type: string }
        sequence_no: { type: integer }
        title: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, project_id, generation_run_id, content_type_code, status, sequence_no, title, version]
    GenerationRunDetailResponse:
      allOf:
        - $ref: '#/components/schemas/GenerationRunResponse'
        - type: object
          properties:
            step_runs:
              type: array
              items: { type: object }
            agent_tasks:
              type: array
              items: { type: object }
            llm_call_logs:
              type: array
              items: { type: object }
            content_items:
              type: array
              items:
                $ref: '#/components/schemas/ContentItemResponse'
            error: { type: string }
    ContentItemDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ContentItemResponse'
        - type: object
          properties:
            body: { type: string }
            metadata: { type: object }
            extension: { type: object }
          required: [body, metadata, extension]
    CreateScheduleRequest:
      type: object
      properties:
        project_id: { type: string }
